[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smugmug"
description = "A friendly Python client for the SmugMug API v2"
readme = "README.rst"
license = "BSD-3-Clause"
requires-python = ">=3.14"
authors = [
    { name = "amruta.org" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31.0",
    "requests-oauthlib>=1.3.0",
    "tenacity>=8.0.0",
]

dynamic = ["version"]

[project.urls]
Repository = "https://github.com/amrutadotorg/smugmug-python"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff",
    "pyright",
    "types-requests",
]

[tool.hatch.version]
path = "smugmug/__init__.py"

[tool.pytest.ini_options]
testpaths = ["smugmug/tests"]
markers = [
    "integration: tests that hit the live SmugMug API (opt-in via SMUGMUG_* env vars)",
]
